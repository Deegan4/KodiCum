name: Publish Kodi source

# Serves repo/zips/ on GitHub Pages so Kodi's File manager can add it as a
# source. raw.githubusercontent.com can't list directories, which is why adding
# the raw URL fails with "Couldn't retrieve directory information".
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The source URL is then https://deegan4.github.io/KodiCum/

on:
  push:
    branches: [main]
    paths: ["repo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo/zips
      - id: deployment
        uses: actions/deploy-pages@v4
